<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶貝們的專屬入口網站</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 50px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #ff5722;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        p.subtitle {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 800px;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            width: 180px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        .card img {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            object-fit: contain;
        }
        .card h3 {
            margin: 0;
            font-size: 1.1rem;
            color: #333;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>🌟 寶貝們的快樂小天地 🌟</h1>
    <p class="subtitle">點擊下方的圖示就能前往你想玩的網站喔！</p>

    <div class="container">
        <!-- 網站一：pokesurvivor.com -->
        <a class="card" href="https://pokesurvivor.com" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=pokesurvivor.com&sz=128" alt="pokesurvivor.com icon">
            <h3>pokesurvivor.com</h3>
        </a>

        <!-- 網站二：tw.portal-pokemon.com -->
        <a class="card" href="https://tw.portal-pokemon.com" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=tw.portal-pokemon.com&sz=128" alt="tw.portal-pokemon.com icon">
            <h3>寶可夢台灣官網</h3>
        </a>
    </div>

</body>
</html>
