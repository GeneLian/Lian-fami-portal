<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 寶貝們的快樂童話樂園 🌟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@500;700&display=swap');

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #fff, 4px 4px 10px rgba(0,0,0,0.1);
        }

        p.subtitle {
            color: #2f3542;
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* 童趣選單卡片 */
        .menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid #ffa502;
            padding: 15px 25px;
            border-radius: 25px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #2f3542;
            width: 130px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            background: #fff;
            border-color: #ff6b81;
            box-shadow: 0 15px 25px rgba(255, 107, 129, 0.3);
        }

        .card img {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            object-fit: contain;
        }

        .card span {
            font-size: 1rem;
            font-weight: 700;
            color: #3742fa;
        }

        /* 內嵌視窗外框 (加上可愛圓角與邊框) */
        .iframe-container {
            width: 100%;
            max-width: 1000px;
            height: 550px;
            margin: 0 auto;
            background: white;
            border: 6px solid #7bed9f;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .iframe-header {
            background: #2ed573;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .iframe-header a {
            background: #ffa502;
            color: white;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.9rem;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .iframe-header a:hover {
            background: #ff7675;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #f1f2f6;
        }
    </style>
</head>
<body>

    <h1>🎈 寶貝們的快樂童話樂園 🎈</h1>
    <p class="subtitle">✨ 點擊上方的可愛小圖示，馬上開始玩耍吧！ ✨</p>

    <!-- 上方童趣選單 -->
    <div class="menu">
        <div class="card" onclick="loadSite('https://pokesurvivor.com', 'Pokesurvivor 生存遊戲')">
            <img src="https://www.google.com/s2/favicons?domain=pokesurvivor.com&sz=128" alt="icon">
            <span>生存遊戲</span>
        </div>
        <div class="card" onclick="loadSite('https://tw.portal-pokemon.com', '寶可夢台灣官網')">
            <img src="https://www.google.com/s2/favicons?domain=tw.portal-pokemon.com&sz=128" alt="icon">
            <span>寶可夢官網</span>
        </div>
    </div>

    <!-- 下方內嵌視窗 -->
    <div class="iframe-container">
        <div class="iframe-header">
            <span id="iframe-title">🏰 請先點擊上方的小圖示唷！</span>
            <a id="external-link" href="#" target="_blank" style="display:none;">在新分頁大螢幕玩 🚀</a>
        </div>
        <iframe id="viewer" src="about:blank" title="Game View"></iframe>
    </div>

    <script>
        function loadSite(url, titleName) {
            const iframe = document.getElementById('viewer');
            const title = document.getElementById('iframe-title');
            const extLink = document.getElementById('external-link');
            
            iframe.src = url;
            title.innerText = '🎮 ' + titleName;
            extLink.href = url;
            extLink.style.display = 'inline-block';
        }
    </script>

</body>
</html>
