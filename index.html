<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍄 瑪利歐的童話樂園 🌟</title>
    <!-- 引入經典像素字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            /* 經典瑪利歐天空藍漸層 */
            background: linear-gradient(to bottom, #5c94fc 0%, #5c94fc 70%, #d88000 70%, #e8a838 72%, #208800 72%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Noto Sans TC', sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            color: #f83800;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
        }

        p.subtitle {
            font-family: 'Press Start 2P', monospace;
            color: #fcfcfa;
            font-size: 0.8rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #000;
        }

        /* 遊戲選單容器 */
        .menu {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 900px;
            z-index: 10;
        }

        /* 問號磚塊風格卡片 */
        .card {
            background: #f8b800;
            border: 4px solid #000;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 6px 6px 0px #000;
            text-decoration: none;
            color: #000;
            width: 180px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            position: relative;
        }

        /* 問號方塊的四角亮點 */
        .card::before {
            content: "?";
            font-family: 'Press Start 2P', monospace;
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 1rem;
            color: #7c3f00;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 6px 12px 0px #000;
            background: #fcd834;
        }

        .card:active {
            transform: translateY(2px);
            box-shadow: 6px 4px 0px #000;
        }

        .card img {
            width: 64px;
            height: 64px;
            margin-top: 10px;
            margin-bottom: 15px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .card span {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: #000;
            background: #fff;
            padding: 6px 10px;
            border: 2px solid #000;
            border-radius: 2px;
            width: 100%;
        }

        /* 全螢幕檢視模式 */
        #fullscreen-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
        }

        #fullscreen-view iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 瑪利歐風格的水管/金幣返回首頁按鈕 */
        .back-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #00a800;
            color: #fff;
            border: 3px solid #000;
            padding: 10px 18px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-home-btn:hover {
            background: #00c800;
            transform: scale(1.05);
        }

        .back-home-btn:active {
            transform: translateY(2px);
            box-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>

    <!-- 主頁面選單 -->
    <div id="home-view">
        <h1>SUPER KIDS WORLD</h1>
        <p class="subtitle">SELECT YOUR GAME!</p>

        <div class="menu">
            <!-- 1. 生存遊戲 (支援全螢幕內嵌) -->
            <div class="card" onclick="openFullscreen('https://pokesurvivor.com', true)">
                <img src="https://www.google.com/s2/favicons?domain=pokesurvivor.com&sz=128" alt="Pokesurvivor icon">
                <span>SURVIVOR</span>
            </div>

            <!-- 2. 寶可夢圖鑑 (自動開新分頁) -->
            <div class="card" onclick="openFullscreen('https://tw.portal-pokemon.com/pokedex/', false)">
                <img src="https://www.google.com/s2/favicons?domain=tw.portal-pokemon.com&sz=128" alt="Pokemon Pokedex icon">
                <span>POKEDEX</span>
            </div>
        </div>
    </div>

    <!-- 全螢幕檢視容器 -->
    <div id="fullscreen-view">
        <button class="back-home-btn" onclick="goHome()">PIPE 🏠 HOME</button>
        <iframe id="fullscreen-iframe" src="about:blank" title="Fullscreen View"></iframe>
    </div>

    <script>
        function openFullscreen(url, canEmbed) {
            if (canEmbed) {
                const fsView = document.getElementById('fullscreen-view');
                const iframe = document.getElementById('fullscreen-iframe');
                
                iframe.src = url;
                fsView.style.display = 'block';
            } else {
                window.open(url, '_blank');
            }
        }

        function goHome() {
            const fsView = document.getElementById('fullscreen-view');
            const iframe = document.getElementById('fullscreen-iframe');
            
            fsView.style.display = 'none';
            iframe.src = 'about:blank';
        }
    </script>

</body>
</html>
