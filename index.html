<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢兒童安全入口網</title>
    
    <style>
        /* 1. 載入專案內的注音標楷體 */
        @font-face {
            font-family: 'MyBpmfKai';
            src: url('./fonts/BpmfZiHiKaiStd-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body, h1, h2, h3, p, span, a, div {
            font-family: 'MyBpmfKai', "Microsoft JhengHei", sans-serif !important;
        }

        body {
            background-color: #f7f9fa;
            background-image: radial-gradient(#e0f2fe 2px, transparent 2px);
            background-size: 24px 24px;
            text-align: center;
            padding: 30px;
            color: #2b2b2b;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #cc0000;
            font-size: 2.8rem;
            text-shadow: 2px 2px 0px #ffde00;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #4a5568;
            margin-bottom: 40px;
        }

        .portal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
            margin-bottom: 60px;
        }

        .card {
            background-color: white;
            border: 4px solid #ffde00;
            border-radius: 20px;
            padding: 25px 20px;
            width: 210px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
            border-color: #cc0000;
        }

        /* 2. 關鍵：將圖片變成「動畫框框」，只顯示其中一格並讓它影格播放 */
        .pokemon-sprite {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            margin-bottom: 15px;
            background-repeat: no-repeat;
            /* 這裡套用我們等等寫的動態影格動畫 */
            animation: play-anim 1s steps(4) infinite;
        }

        /* 定義像素動畫影格（假設橫向有 4 格動作） */
        @keyframes play-anim {
            from { background-position: 0px 0px; }
            to { background-position: -256px 0px; } /* 64px * 4格 = 256px */
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2b7a78;
            margin-bottom: 5px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #666;
        }

        /* 右下角互動寶可夢夥伴 */
        #companion-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
        }

        #companion-speech {
            background: white;
            border: 3px solid #ffde00;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #cc0000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 8px;
        }

        #companion-img {
            width: 80px;
            height: 80px;
            image-rendering: pixelated;
            background-repeat: no-repeat;
            animation: play-anim 1s steps(4) infinite;
        }
    </style>
</head>
<body>

    <h1>⚡ 寶可夢兒童安全入口網 ⚡</h1>
    <p class="subtitle">點擊下方夥伴，前往安心的網站探險吧！</p>

    <div class="portal-container" id="card-container">
        <p style="color: #888;">正在呼叫寶可夢白名單清單...</p>
    </div>

    <div id="companion-box" onclick="interactCompanion()">
        <div id="companion-speech">點我換夥伴！</div>
        <div id="companion-img" style="background-image: url('./images/25/Walk.png');"></div>
    </div>

    <script>
        async function loadWhitelist() {
            try {
                const response = await fetch('whitelist.json');
                const data = await response.json();
                const container = document.getElementById('card-container');
                container.innerHTML = ''; 

                data.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = item.url;
                    card.target = '_blank';

                    // 這裡使用背景圖片的方式來呈現精靈圖
                    card.innerHTML = `
                        <div class="pokemon-sprite" style="background-image: url('./images/${item.pokemonId}/Walk.png');"></div>
                        <span class="card-title">${item.title}</span>
                        <span class="card-desc">${item.desc}</span>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('讀取 whitelist.json 失敗:', error);
                document.getElementById('card-container'].innerHTML = '<p style="color:red;">載入白名單失敗！</p>';
            }
        }

        loadWhitelist();

        const companionIds = [25, 4, 7, 150]; 
        const speeches = [
            "皮卡皮卡！今天想去哪裡玩？",
            "小火龍準備好囉！",
            "傑尼傑尼～點上方按鈕出發！",
            "超夢陪你一起探索宇宙！"
        ];
        let currentIndex = 0;

        function interactCompanion() {
            currentIndex = (currentIndex + 1) % companionIds.length;
            const id = companionIds[currentIndex];
            
            document.getElementById('companion-img').style.backgroundImage = `url('./images/${id}/Walk.png')`;
            document.getElementById('companion-speech').innerText = speeches[currentIndex];
        }
    </script>
</body>
</html>
