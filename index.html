<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFARI 兒童安全入口網</title>
    
    <style>
        /* 1. 宣告你的本地注音標楷體 */
        @font-face {
            font-family: 'MyBpmfKai';
            src: url('./fonts/BpmfZiHiKaiStd-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'MyBpmfKai', "Microsoft JhengHei", sans-serif;
            background-image: url('./images/map-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: rgba(255, 255, 255, 0.92);
            padding: 15px 35px;
            border-radius: 16px;
            border: 4px solid #3b82f6;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.6rem;
            color: #1e3a8a;
            letter-spacing: 2px;
        }

        .portal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
            width: 100%;
        }

        /* 網站卡片樣式 */
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border: 4px solid #f59e0b;
            border-radius: 20px;
            padding: 25px 20px;
            width: 220px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: #ef4444;
        }

        /* 靜態寶可夢圖標樣式（絕對穩定、絕不破圖） */
        .pokemon-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
            image-rendering: pixelated;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <header>
        <h1>SAFARI 兒童安全入口網</h1>
    </header>

    <!-- 動態生成白名單卡片的容器 -->
    <div class="portal-container" id="card-container">
        <!-- JavaScript 會自動把 whitelist.json 裡的內容填進這裡 -->
    </div>

    <script>
        // 自動讀取外部 whitelist.json 並動態產生卡片
        async function loadWhitelist() {
            try {
                const response = await fetch('whitelist.json');
                const sites = await response.json();
                const container = document.getElementById('card-container');
                
                container.innerHTML = ''; // 清空載入中提示

                sites.forEach(site => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = site.url;
                    card.target = '_blank';

                    // 這裡對應你本機 images 資料夾中的寶可夢靜態圖或編號路徑
                    // 例如 ./images/pokemon/25/front.png 或直接對應編號
                    const imgPath = `./images/pokemon/${site.pokemonId}/front.png`;

                    card.innerHTML = `
                        <img class="pokemon-icon" src="${imgPath}" alt="${site.title}" onerror="this.src='./images/pokemon/1/front.png'">
                        <span class="card-title">${site.title}</span>
                        <span class="card-desc">${site.desc}</span>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('無法載入白名單:', error);
                document.getElementById('card-container').innerHTML = '<p style="color:white; font-size:1.2rem;">載入白名單失敗，請檢查 whitelist.json 格式！</p>';
            }
        }

        // 頁面載入後執行
        loadWhitelist();
    </script>

</body>
</html>
