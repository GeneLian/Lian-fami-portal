<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFARI 兒童安全入口網</title>
    
    <style>
        /* 1. 精準對應你的 .ttf 檔名大小寫：BpmfZihiKaiStd-Regular.ttf */
        @font-face {
            font-family: 'BpmfZiKaiStd';
            src: url('./fonts/BpmfZihiKaiStd-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 強制全站使用你的注音標楷體 */
            font-family: 'BpmfZiKaiStd', "Microsoft JhengHei", sans-serif;
            background-image: url('./images/map-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 強制重新整理按鈕樣式 */
        .refresh-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ffffff;
            border: 3px solid #3b82f6;
            color: #1e3a8a;
            padding: 8px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: background-color 0.2s, transform 0.1s;
        }

        .refresh-btn:hover {
            background-color: #eff6ff;
            transform: scale(1.05);
        }

        header {
            background-color: rgba(255, 255, 255, 0.92);
            padding: 15px 35px;
            border-radius: 16px;
            border: 4px solid #3b82f6;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.6rem;
            color: #1e3a8a;
            letter-spacing: 2px;
        }

        .portal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
            width: 100%;
        }

        /* 網站卡片樣式 */
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border: 4px solid #f59e0b;
            border-radius: 20px;
            padding: 25px 20px;
            width: 220px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: #ef4444;
        }

        /* 官方網站 ICON 樣式 */
        .site-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <!-- 強制重整按鈕 -->
    <button class="refresh-btn" onclick="forceReload()">🔄 重新整理</button>

    <header>
        <h1>SAFARI 兒童安全入口網</h1>
    </header>

    <!-- 動態生成白名單卡片的容器 -->
    <div class="portal-container" id="card-container">
        <!-- 載入中提示 -->
        <p style="color: white; font-size: 1.2rem;">正在載入安心網站...</p>
    </div>

    <script>
        // 強制繞過快取的重新整理函式
        function forceReload() {
            window.location.href = window.location.pathname + '?t=' + new Date().getTime();
        }

        // 自動讀取外部 whitelist.json 並動態產生卡片（帶入時間戳記防快取）
        async function loadWhitelist() {
            try {
                const response = await fetch('whitelist.json?v=' + new Date().getTime());
                const sites = await response.json();
                const container = document.getElementById('card-container');
                
                container.innerHTML = ''; // 清空載入中提示

                sites.forEach(site => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = site.url;
                    card.target = '_blank';

                    // 從網址提取主網域，利用 Google 免費 Favicon API 取得官方圖標
                    const domain = new URL(site.url).hostname;
                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                    card.innerHTML = `
                        <img class="site-icon" src="${faviconUrl}" alt="${site.title}" onerror="this.style.display='none'">
                        <span class="card-title">${site.title}</span>
                        <span class="card-desc">${site.desc}</span>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('無法載入白名單:', error);
                document.getElementById('card-container').innerHTML = '<p style="color:white; font-size:1.2rem;">載入白名單失敗，請檢查 whitelist.json 格式！</p>';
            }
        }

        // 頁面載入後執行
        loadWhitelist();
    </script>

</body>
</html>
