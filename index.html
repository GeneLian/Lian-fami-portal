<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢兒童安全入口網</title>
    
    <!-- 匯入 ToneOZ / 字嗨 注音標楷網頁字型 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toneoz-font-bopomofo-kai@1.0.0/style.css">

    <style>
        /* 套用注音標楷體 */
        body {
            font-family: 'ToneOZ Bopomofo Kai', "Microsoft JhengHei", sans-serif;
            background-color: #f7f9fa;
            background-image: radial-gradient(#e0f2fe 2px, transparent 2px);
            background-size: 24px 24px;
            text-align: center;
            padding: 20px;
            color: #2b2b2b;
        }

        /* 主標題樣式 */
        h1 {
            color: #cc0000;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px #ffde00;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #4a5568;
            margin-bottom: 30px;
        }

        /* 寶可夢卡片容器 */
        .portal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* 白名單連結卡片 */
        .card {
            background-color: white;
            border: 4px solid #ffde00;
            border-radius: 16px;
            padding: 20px;
            width: 200px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
            border-color: #cc0000;
        }

        /* 引用的 pokesurvivor 寶可夢圖片 */
        .pokemon-img {
            width: 80px;
            height: 80px;
            image-rendering: pixelated; /* 保持像素風格清析 */
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2b7a78;
        }
    </style>
</head>
<body>

    <h1>⚡ 寶可夢兒童白名單入口 ⚡</h1>
    <p class="subtitle">點擊寶可夢夥伴，前往安全的網站探險吧！</p>

    <div class="portal-container">
        <!-- 卡片 1：使用 pokesurvivor 的皮卡丘 (Pikachu - #025) 資源 -->
        <a class="card" href="https://pedia.cloud.edu.tw" target="_blank">
            <img class="pokemon-img" src="https://raw.githubusercontent.com/JPTER78/pokesurvivor/main/public/sprites/pokemon/25.png" alt="皮卡丘">
            <span class="card-title">教育部萌典</span>
        </a>

        <!-- 卡片 2：使用 pokesurvivor 的小火龍 (Charmander - #004) 資源 -->
        <a class="card" href="https://www.coolmathgames.com" target="_blank">
            <img class="pokemon-img" src="https://raw.githubusercontent.com/JPTER78/pokesurvivor/main/public/sprites/pokemon/4.png" alt="小火龍">
            <span class="card-title">CoolMath遊戲</span>
        </a>

        <!-- 卡片 3：使用 pokesurvivor 的傑尼龜 (Squirtle - #007) 資源 -->
        <a class="card" href="https://www.childrensbooksonline.org" target="_blank">
            <img class="pokemon-img" src="https://raw.githubusercontent.com/JPTER78/pokesurvivor/main/public/sprites/pokemon/7.png" alt="傑尼龜">
            <span class="card-title">童書繪本網</span>
        </a>
    </div>

</body>
</html>
