<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 寶貝們的快樂童話樂園 🌟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #fff, 4px 4px 10px rgba(0,0,0,0.1);
        }

        p.subtitle {
            color: #2f3542;
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-weight: 700;
        }

        /* 童趣選單卡片 */
        .menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            max-width: 800px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #ffa502;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #2f3542;
            width: 160px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.05);
            background: #fff;
            border-color: #ff6b81;
            box-shadow: 0 15px 25px rgba(255, 107, 129, 0.3);
        }

        .card img {
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
            object-fit: contain;
        }

        .card span {
            font-size: 1.1rem;
            font-weight: 700;
            color: #3742fa;
        }

        /* 全螢幕檢視模式（點擊後啟動） */
        #fullscreen-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
        }

        #fullscreen-view iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 半透明返回首頁懸浮按鈕 */
        .back-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-home-btn:hover {
            background: rgba(255, 71, 87, 0.8);
            border-color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- 主頁面選單 -->
    <div id="home-view">
        <h1>🎈 寶貝們的快樂童話樂園 🎈</h1>
        <p class="subtitle">✨ 點擊喜歡的圖示，直接全螢幕暢玩！ ✨</p>

        <div class="menu">
            <!-- 1. 生存遊戲 -->
            <div class="card" onclick="openFullscreen('https://pokesurvivor.com', true)">
                <img src="https://www.google.com/s2/favicons?domain=pokesurvivor.com&sz=128" alt="icon">
                <span>生存遊戲</span>
            </div>

            <!-- 2. 寶可夢官網 -->
            <div class="card" onclick="openFullscreen('https://tw.portal-pokemon.com', false)">
                <img src="https://www.google.com/s2/favicons?domain=tw.portal-pokemon.com&sz=128" alt="icon">
                <span>寶可夢官網</span>
            </div>

            <!-- 3. 寶可夢圖鑑 -->
            <div class="card" onclick="openFullscreen('https://tw.portal-pokemon.com/pokedex/', false)">
                <img src="https://www.google.com/s2/favicons?domain=tw.portal-pokemon.com&sz=128" alt="icon">
                <span>寶可夢圖鑑</span>
            </div>
        </div>
    </div>

    <!-- 全螢幕檢視容器 (內含半透明返回按鈕與 iframe) -->
    <div id="fullscreen-view">
        <button class="back-home-btn" onclick="goHome()">🏠 回首頁</button>
        <iframe id="fullscreen-iframe" src="about:blank" title="Fullscreen View"></iframe>
    </div>

    <script>
        function openFullscreen(url, canEmbed) {
            if (canEmbed) {
                // 如果該網站允許內嵌，直接在全螢幕 iframe 中展開並顯示半透明返回鍵
                const fsView = document.getElementById('fullscreen-view');
                const iframe = document.getElementById('fullscreen-iframe');
                
                iframe.src = url;
                fsView.style.display = 'block';
            } else {
                // 如果遇到像寶可夢官網這種會被防護阻擋的網站，則安全地幫你開新分頁
                window.open(url, '_blank');
            }
        }

        function goHome() {
            const fsView = document.getElementById('fullscreen-view');
            const iframe = document.getElementById('fullscreen-iframe');
            
            // 關閉全螢幕視窗並清空 iframe（停止背景執行與聲音）
            fsView.style.display = 'none';
            iframe.src = 'about:blank';
        }
    </script>

</body>
</html>
