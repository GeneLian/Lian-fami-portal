<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寶可夢冒險樂園 - PokéSurvivor</title>
    <!-- 引入支援繁體中文與注音友善的字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            /* 採用 PokéSurvivor 招牌的深色、神祕迷宮與像素風格背景 */
            background-color: #0d1117;
            background-image: 
                radial-gradient(circle at 50% 30%, #1f2937 0%, #0d1117 70%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            font-family: 'Noto Sans TC', sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 頂部寶可夢風格橫幅標題 */
        .header-box {
            margin-bottom: 35px;
        }

        .header-box h1 {
            color: #ffcb05;
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0 0 8px 0;
            text-shadow: 3px 3px 0px #1a3c8e, -1px -1px 0px #1a3c8e;
            letter-spacing: 2px;
        }

        .header-box .zh-title {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* 遊戲選單容器 (仿 PokéSurvivor 風格排版) */
        .menu {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 900px;
            z-index: 10;
        }

        /* 寶可夢卡片風格 */
        .card {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 3px solid #374151;
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            color: #fff;
            width: 200px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #ffcb05;
            box-shadow: 0 15px 35px rgba(255, 203, 5, 0.2);
            background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
        }

        .card:active {
            transform: translateY(-2px);
        }

        .card img {
            width: 72px;
            height: 72px;
            margin-bottom: 15px;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        /* 中文與注音並行的文字區塊 */
        .text-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 注音行（上方，帶點溫暖的黃色方便小朋友對照練習） */
        .zhuyin {
            font-size: 0.85rem;
            color: #ffcb05;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        /* 中文字行（下方，清晰易讀） */
        .chinese-text {
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: 700;
        }

        /* 全螢幕檢視模式 */
        #fullscreen-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
        }

        #fullscreen-view iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 返回首頁按鈕（寶可夢風格藍黃圓角按鈕） */
        .back-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #ffcb05;
            color: #1a3c8e;
            border: 3px solid #1a3c8e;
            padding: 10px 20px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-home-btn:hover {
            background: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- 頂部標題（寶可夢風格與注音並行） -->
    <div class="header-box">
        <h1>POKÉMON PORTAL</h1>
        <div class="zh-title">
            <div class="zhuyin">ㄅㄠˇ ㄎㄜˇ ㄇㄥˊ ㄊㄨㄥˊ ㄏㄨㄚˋ ㄌㄜˋ ㄩㄢˊ</div>
            寶可夢童話樂園
        </div>
    </div>

    <!-- 主頁面選單 -->
    <div id="home-view">
        <div class="menu">
            <!-- 1. PokéSurvivor 生存遊戲 (支援全螢幕內嵌) -->
            <div class="card" onclick="openFullscreen('https://pokesurvivor.com', true)">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAABMSURBVHgB7c4xDQAwEMSw8s/9M7zKAsm3QkO5Zk1NTRWga9oAgEC6LwBAID0AQCA9AEAgPQBAID0AQCA9AEAgPQBAIN0bBwAP55t/c/eQAAAAAElFTkSuQmCC" alt="PokéSurvivor icon">
                <div class="text-group">
                    <div class="zhuyin">ㄕㄥ ㄘㄨㄣˊ ㄧㄡˊ ㄒㄧˋ</div>
                    <div class="chinese-text">生存遊戲</div>
                </div>
            </div>

            <!-- 2. 寶可夢圖鑑 (自動開新分頁) -->
            <div class="card" onclick="openFullscreen('https://tw.portal-pokemon.com/pokedex/', false)">
                <img src="https://www.google.com/s2/favicons?domain=tw.portal-pokemon.com&sz=128" alt="Pokemon Pokedex icon">
                <div class="text-group">
                    <div class="zhuyin">ㄅㄠˇ ㄎㄜˇ ㄇㄥˊ ㄊㄨˊ ㄐㄧㄢˋ</div>
                    <div class="chinese-text">寶可夢圖鑑</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 全螢幕檢視容器 -->
    <div id="fullscreen-view">
        <button class="back-home-btn" onclick="goHome()">🏠 回首頁</button>
        <iframe id="fullscreen-iframe" src="about:blank" title="Fullscreen View"></iframe>
    </div>

    <script>
        function openFullscreen(url, canEmbed) {
            if (canEmbed) {
                const fsView = document.getElementById('fullscreen-view');
                const iframe = document.getElementById('fullscreen-iframe');
                
                iframe.src = url;
                fsView.style.display = 'block';
            } else {
                window.open(url, '_blank');
            }
        }

        function goHome() {
            const fsView = document.getElementById('fullscreen-view');
            const iframe = document.getElementById('fullscreen-iframe');
            
            fsView.style.display = 'none';
            iframe.src = 'about:blank';
        }
    </script>

</body>
</html>
